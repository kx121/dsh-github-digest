# 行配置（可选）：这一层 config 只在「设置页还没存过任何东西」时作为初值；
# 设置页保存的值存在插件自己的状态文件（~/.dsh/github-digest/config.json）里，优先级更高。
# ============================================================================

- insert:
    - id: dsh-github-digest
      name: dsh-github-digest
